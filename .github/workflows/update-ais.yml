name: AIS 데이터 갱신

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 (UTC 기준, 정각 혼잡을 피해 7분, 37분)
  workflow_dispatch: {}       # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: update-ais
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets
      - name: AIS 수집
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python scripts/fetch_ais.py
      - name: 변경 시에만 커밋
        run: |
          git config user.name "ais-update-bot"
          git config user.email "ais-update-bot@users.noreply.github.com"
          git add data/ais_state.json
          git diff --cached --quiet || (git commit -m "AIS 데이터 자동 갱신" && git push)
